# ==============================================================================
# Nginx Reverse Proxy Configuration for SiPesand SaaS (sipesand.web.id)
# Support: Wildcard Subdomains (*.sipesand.web.id) + Cloudflare Real IP + SSL
# ==============================================================================

# Cloudflare Real IP Restoration (Membaca IP asli pengunjung)
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;

# 1. HTTP to HTTPS Redirection
server {
    listen 80;
    listen [::]:80;
    server_name sipesand.web.id *.sipesand.web.id;

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Production Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sipesand.web.id *.sipesand.web.id;

    # SSL Certificates (Let's Encrypt / Cloudflare Origin Certificate)
    ssl_certificate /etc/letsencrypt/live/sipesand.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sipesand.web.id/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Max Upload Size (Untuk Upload Bukti Transfer & Foto Santri)
    client_max_body_size 25M;

    # 1. Backend REST API Routing
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Subdomain $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # 2. Webhook Payment Gateway Endpoint
    location /api/webhook/ {
        proxy_pass http://127.0.0.1:5000/api/webhook/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 3. Frontend React App (SPA Static / Proxy)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
