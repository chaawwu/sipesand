name: Deploy SiPesand to Cloudflare Pages 🚀

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy Frontend to Cloudflare Pages
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: 🏗️ Build Frontend (Vite Production)
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_URL: '/api'

      - name: 🔧 Ensure Cloudflare Pages Project Exists
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        if: env.CF_TOKEN != '' && env.CF_ACCOUNT != ''
        run: |
          set -euo pipefail
          PROJECT_URL="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects/sipesand-app"
          PROJECT_STATUS=$(curl --silent --show-error --output /tmp/pages-project.json --write-out "%{http_code}" \
            --header "Authorization: Bearer ${CF_TOKEN}" \
            --header "Content-Type: application/json" \
            "${PROJECT_URL}")

          if [ "${PROJECT_STATUS}" = "404" ]; then
            echo "Cloudflare Pages project belum ada. Membuat sipesand-app..."
            curl --silent --show-error --fail --request POST \
              --header "Authorization: Bearer ${CF_TOKEN}" \
              --header "Content-Type: application/json" \
              --data '{"name":"sipesand-app","production_branch":"main"}' \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects"
          elif [ "${PROJECT_STATUS}" != "200" ]; then
            cat /tmp/pages-project.json
            echo "Cloudflare Pages project gagal diperiksa (HTTP ${PROJECT_STATUS})."
            exit 1
          else
            echo "Cloudflare Pages project sipesand-app sudah tersedia."
          fi

      - name: ☁️ Deploy to Cloudflare Pages via API
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        if: env.CF_TOKEN != '' && env.CF_ACCOUNT != ''
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: sipesand-app
          directory: frontend/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: ℹ️ Status Integrasi Cloudflare Pages
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        if: env.CF_TOKEN == '' || env.CF_ACCOUNT == ''
        run: |
          echo "=========================================================================="
          echo "✅ Build Produksi Frontend Berhasil 100%!"
          echo "ℹ️ Catatan: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID belum diset di GitHub Secrets."
          echo "🌐 Website https://sipesand.web.id ter-deploy otomatis via Cloudflare Native Git Integration."
          echo "=========================================================================="
