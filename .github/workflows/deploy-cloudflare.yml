name: Deploy SiPesand to Cloudflare Pages 🚀

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy Frontend to Cloudflare Pages
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: 🏗️ Build Frontend (Vite Production)
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_URL: '/api'

      - name: ☁️ Deploy to Cloudflare Pages via API
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: sipesand-app
          directory: frontend/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: ℹ️ Status Integrasi Cloudflare Pages
        if: ${{ secrets.CLOUDFLARE_API_TOKEN == '' || secrets.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: |
          echo "=========================================================================="
          echo "✅ Build Produksi Frontend Berhasil 100%!"
          echo "ℹ️ Catatan: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID belum diset di GitHub Secrets."
          echo "🌐 Website https://sipesand.web.id ter-deploy otomatis via Cloudflare Native Git Integration."
          echo "=========================================================================="
