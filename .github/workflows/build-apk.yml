name: Build SiPesand Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 🚀 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: 📝 Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: 🏗️ Build Vite Frontend
        working-directory: ./frontend
        run: npm run build

      - name: 🔄 Copy Web Assets to Android Project
        run: |
          mkdir -p frontend/android/app/src/main/assets/public
          cp -r frontend/dist/* frontend/android/app/src/main/assets/public/
          cp frontend/capacitor.config.json frontend/android/app/src/main/assets/capacitor.config.json
          chmod +x frontend/android/gradlew

      - name: 🔨 Compile Android APK (Debug / Direct Installable)
        working-directory: ./frontend/android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          chmod +x ./gradlew
          if ! ./gradlew assembleDebug --no-daemon > error.txt 2>&1; then
            tail -n 100 error.txt
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git checkout -B build-log
            git add error.txt
            git commit -m "ci: capture gradle build error"
            git push origin build-log -f || true
            exit 1
          fi

      - name: 🔨 Compile Ananda Wali Santri Native APK (Kotlin / Jetpack Compose)
        working-directory: ./ananda-android
        continue-on-error: true
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon || true
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            mkdir -p ../dist-apk
            cp app/build/outputs/apk/debug/app-debug.apk ../dist-apk/ananda-wali-sipesand.apk
          fi

      - name: 📂 Prepare APK Output
        run: |
          mkdir -p dist-apk
          if [ -f "frontend/android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp frontend/android/app/build/outputs/apk/debug/app-debug.apk dist-apk/sipesand-app.apk
            cp frontend/android/app/build/outputs/apk/debug/app-debug.apk dist-apk/sipesand-release.apk
          fi
          if [ -f "ananda-android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp ananda-android/app/build/outputs/apk/debug/app-debug.apk dist-apk/ananda-wali-sipesand.apk
          fi
          ls -la dist-apk/

      - name: 📤 Upload APK Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: sipesand-apk
          path: dist-apk/*.apk
          retention-days: 30

      - name: 🏷️ Publish APK to GitHub Releases (Optional / Automated)
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: "v1.0.0-apk"
          name: "SiPesand Mobile App v1.0.0 (Android APK)"
          body: |
            ### 📱 Aplikasi SiPesand Mobile & Ananda Wali Santri (Android APK)
            
            Unduh file APK resmi SiPesand untuk dipasang di smartphone Android Anda:
            
            1. **`ananda-wali-sipesand.apk`**: Aplikasi khusus Wali Santri (Kotlin / Jetpack Compose Native) dengan UI Header Lengkung & 12 Menu Layanan Santri.
            2. **`sipesand-app.apk`**: Aplikasi Portal Manajemen Pesantren (Admin, Pengurus, Kamtib, Keuangan).
            
            #### Fitur Utama:
            - **Multi-Tenant Otomatis**: Hubungkan ke subdomain pondok Anda (contoh: `darulrahman`, `namapondok`).
            - **Native Performance**: Realtime Chat, Pembayaran KaseraPay QRIS, Izin Pulang Santri.
            - **Offline-First Sync**: Tersinkronisasi aman dengan Cloud Firestore & Laravel API.
            
            #### Cara Pasang:
            1. Unduh file APK yang diinginkan di bawah.
            2. Buka file di HP Android dan izinkan instalasi dari sumber tidak dikenal (*Allow Unknown Sources*).
            3. Buka aplikasi dan pilih pondok pesantren Anda.
          files: |
            dist-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
