name: Build SiPesand Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'ananda-android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 🚀 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 platforms;android-36 build-tools;34.0.0 build-tools;36.0.0'

      - name: 📝 Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: 🏗️ Build Vite Frontend
        working-directory: ./frontend
        run: npm run build

      - name: 🔄 Copy Web Assets to Android Project
        run: |
          mkdir -p frontend/android/app/src/main/assets/public
          cp -r frontend/dist/* frontend/android/app/src/main/assets/public/
          cp frontend/capacitor.config.json frontend/android/app/src/main/assets/capacitor.config.json
          chmod +x frontend/android/gradlew

      - name: 🔨 Compile Android APK (Debug / Direct Installable)
        working-directory: ./frontend/android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          chmod +x ./gradlew
          if ! ./gradlew assembleDebug --no-daemon > error.txt 2>&1; then
            tail -n 100 error.txt
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git checkout -B build-log
            git add error.txt
            git commit -m "ci: capture gradle build error"
            git push origin build-log -f || true
            exit 1
          fi

      - name: 🔨 Compile Ananda Wali Santri Native APK (Kotlin / Jetpack Compose)
        working-directory: ./ananda-android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          mkdir -p ../dist-apk
          cp app/build/outputs/apk/debug/app-debug.apk ../dist-apk/ananda-wali-sipesand.apk
          ls -la ../dist-apk/

      - name: 📂 Prepare APK Output
        if: always()
        run: |
          mkdir -p dist-apk
          # 1. SiPesand Management APK
          if [ -f "frontend/android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp frontend/android/app/build/outputs/apk/debug/app-debug.apk dist-apk/sipesand-app.apk
            cp frontend/android/app/build/outputs/apk/debug/app-debug.apk dist-apk/sipesand-release.apk
          fi
          # 2. Ananda Wali Santri APK (Strictly from ananda-android)
          if [ -f "ananda-android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp ananda-android/app/build/outputs/apk/debug/app-debug.apk dist-apk/ananda-wali-sipesand.apk
          fi
          ls -la dist-apk/

      - name: 📤 Upload APK Artifact to GitHub Actions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sipesand-apk
          path: dist-apk/*.apk
          retention-days: 30

      - name: 🏷️ Publish APK to GitHub Releases (Optional / Automated)
        if: always()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.6.0-ananda"
          name: "SiPesand & Ananda Wali Santri App v1.6.0 (Android APK)"
          body: |
            ### 📱 Unduh Aplikasi SiPesand Mobile & Ananda Wali Santri (Android APK)
            
            Unduh berkas instalasi (.apk) resmi langsung dari daftar **Assets** di bawah:
            
            1. 🟢 **`ananda-wali-sipesand.apk`**: Aplikasi Khusus **Wali Santri (Ananda by SiPesand)**.
               - Pantau saldo & riwayat uang saku santri secara real-time.
               - Pembayaran SPP & tagihan langsung terhubung dengan **PaymentKu Gateway (paymentku.com)** & Transfer BSI.
               - Fitur cetak & simpan PDF Kwitansi Pembayaran Resmi Sah berstempel digital.
               - Mutaba'ah Tahfidz Quran, Nilai Rapor Digital, Absensi Harian, dan Izin Kepulangan Santri.
            
            2. 🔵 **`sipesand-app.apk`**: Aplikasi **Portal Manajemen Pesantren**.
               - Untuk Pengurus Pondok, Super Administrator, Kasir Kantin RFID, Bendahara, dan Kamtib Keamanan.
            
            #### Panduan Instalasi di HP Android:
            1. Klik dan unduh file APK di bagian **Assets** di bawah ini.
            2. Jika muncul peringatan keamanan browser, pilih *Tetap Unduh* / *Download anyway*.
            3. Buka file yang diunduh dan pilih *Instal*. Aktifkan izin *Install unknown apps* jika diminta.
            4. Buka aplikasi SiPesand atau Ananda untuk mulai menggunakannya.
          files: |
            dist-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
